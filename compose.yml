services:
  pg_db:
    platform: linux/amd64
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d auth -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: "0:0"
    volumes:
      - data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/
    networks:
      - my-network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - my-network

  minio:
    image: minio/minio
    restart: always
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: "mybucket"
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - my-network

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - 3001:3001
    env_file:
      - .env
    networks:
      - my-network
    depends_on:
      pg_db:
        condition: service_healthy

  # frontend:
  #   build: ./apps/frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=3000
  #     - HOSTNAME=0.0.0.0
  #   env_file:
  #     - .env
  #   networks:
  #     - my-network
  #   depends_on:
  #     pg_db:
  #       condition: service_healthy

volumes:
  data:
  minio_data:

networks:
  my-network:
