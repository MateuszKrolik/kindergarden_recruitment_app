services:
  pg_db:
    platform: linux/amd64
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d auth -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: "0:0"
    volumes:
      - data:/var/lib/postgresql/data
      - ./data-access-layer/migrations:/docker-entrypoint-initdb.d/

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  data:
