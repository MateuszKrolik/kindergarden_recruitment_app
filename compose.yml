services:
  pg_db:
    platform: linux/amd64
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d auth -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: "0:0"
    volumes:
      - data:/var/lib/postgresql/data
      - ./data-access-layer/migrations:/docker-entrypoint-initdb.d/

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: always
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: "mybucket"
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  data:
  minio_data:
